<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Cover Letter Generator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2 class="app-heading">📜 Smart Cover Letter Generator</h2>

  <div class="card p-4">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="resume" class="form-label">Upload Your Resume (PDF only)</label>
        <input class="form-control" type="file" id="resume" name="resume" accept=".pdf" required>
      </div>

      <div class="mb-3">
        <label for="job_description" class="form-label">Paste Job Description</label>
        <textarea class="form-control" id="job_description" name="job_description" rows="6" required placeholder="Paste the full job description here...">{{ form_data.job_description if form_data.job_description is defined else '' }}</textarea>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Your Email (optional)</label>
        <input type="email" class="form-control" name="email" placeholder="example@email.com" value="{{ form_data.email if form_data.email is defined else '' }}">
      </div>

      <div class="mb-3">
        <label class="form-label">Your Phone Number</label>
        <div class="input-group">
          <select class="form-select" name="country_code" style="max-width: 160px;">
            <option value="+91" {% if form_data.country_code == "+91" %}selected{% endif %}>🇮🇳 India (+91)</option>
            <option value="+1" {% if form_data.country_code == "+1" %}selected{% endif %}>🇺🇸 USA (+1)</option>
            <option value="+44" {% if form_data.country_code == "+44" %}selected{% endif %}>🇬🇧 UK (+44)</option>
            <option value="+61" {% if form_data.country_code == "+61" %}selected{% endif %}>🇦🇺 Australia (+61)</option>
            <option value="+81" {% if form_data.country_code == "+81" %}selected{% endif %}>🇯🇵 Japan (+81)</option>
            <option value="+49" {% if form_data.country_code == "+49" %}selected{% endif %}>🇩🇪 Germany (+49)</option>
            <option value="+33" {% if form_data.country_code == "+33" %}selected{% endif %}>🇫🇷 France (+33)</option>
            <option value="+92" {% if form_data.country_code == "+92" %}selected{% endif %}>🇵🇰 Pakistan (+92)</option>
          </select>
          <input type="tel" class="form-control" name="phone" placeholder="9876543210" value="{{ form_data.phone if form_data.phone is defined else '' }}">
        </div>
      </div>

      <div class="mb-3">
        <label for="github" class="form-label">GitHub Profile URL (optional)</label>
        <input type="url" class="form-control" name="github" placeholder="https://github.com/yourprofile" value="{{ form_data.github if form_data.github is defined else '' }}">
      </div>

      <div class="mb-3">
        <label for="linkedin" class="form-label">LinkedIn Profile URL (optional)</label>
        <input type="url" class="form-control" name="linkedin" placeholder="https://linkedin.com/in/yourprofile" value="{{ form_data.linkedin if form_data.linkedin is defined else '' }}">
      </div>

      <div class="text-center">
        <button type="submit" class="btn btn-primary">📜 Generate Cover Letter</button>
      </div>
    </form>
  </div>

  {% if result %}
    <div class="cover-letter-box">
      <h5 class="fw-bold">✨ Generated Cover Letter:</h5>
      <pre id="coverLetterText" style="white-space: pre-wrap;">{{ result }}</pre>
      <button class="btn btn-outline-primary mt-2" onclick="copyCoverLetter()">📋 Copy to Clipboard</button>
    </div>
  {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function copyCoverLetter() {
    const text = document.getElementById("coverLetterText").innerText;
    navigator.clipboard.writeText(text).then(function () {
      alert("✅ Cover letter copied to clipboard!");
    }, function (err) {
      alert("❌ Failed to copy: " + err);
    });
  }
</script>
</body>
</html>
